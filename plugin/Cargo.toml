[workspace]
[package]
name = "anistream-ani-cli"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
wit-bindgen = "0.63"
base64 = "0.22"
serde_json = "1"
url = "2"
[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
regex = "1"
